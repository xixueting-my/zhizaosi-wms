<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>商品移位 · WMS</title>
  <link rel="stylesheet" href="../basic/css/wms.css" />
</head>
<body>
  <div class="app">
    <div class="main">
      <header class="topbar">
        <div class="breadcrumb">
          <span>库内管理</span><span class="sep">/</span><strong>商品移位</strong>
        </div>
        <div class="topbar-user">
          <div class="avatar" data-avatar></div>
          <span data-current-user></span>
        </div>
      </header>
      <div class="content">
        <div class="page-header"><h1 class="page-title">商品移位</h1></div>
        <div class="surface">
          <div class="sub-tabs card-tabs" id="status-tabs"></div>
          <div class="list-sticky">
            <div class="filter-bar">
              <div class="filter-item"><label>移位任务号</label><input id="q-no" /></div>
              <div class="filter-item"><label>创建人</label><input id="q-who" /></div>
              <div class="filter-item">
                <button type="button" class="btn btn-primary" id="btn-search">搜索</button>
                <button type="button" class="btn" id="btn-reset">重置</button>
              </div>
            </div>
          </div>
          <div class="list-panel">
            <div class="action-bar" id="actions"></div>
            <div class="table-wrap">
              <table class="data">
                <thead><tr><th>移位任务号</th><th>移位数量</th><th>创建人</th><th>创建时间</th><th>上架完成时间</th><th>操作</th></tr></thead>
                <tbody id="tbody"></tbody>
              </table>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
  <div class="drawer-mask" id="drawer-detail">
    <div class="drawer wide">
      <div class="drawer-header">
        <div><h3 id="detail-title">移位明细</h3><p>下架与上架按唯一码对照</p></div>
        <button type="button" class="btn btn-ghost btn-icon" data-drawer-close aria-label="关闭">×</button>
      </div>
      <div class="drawer-body">
        <div class="sub-tabs" id="detail-tabs"></div>
        <div id="detail-body"></div>
      </div>
    </div>
  </div>
  <script src="../basic/js/common.js"></script>
  <script src="../basic/js/shell.js"></script>
  <script src="../shared/js/org.js"></script>
  <script src="../shared/js/sku.js"></script>
  <script src="../shared/js/flow.js"></script>
  <script src="../shared/js/ui.js"></script>
  <script src="transfer.js"></script>
</body>
</html>
